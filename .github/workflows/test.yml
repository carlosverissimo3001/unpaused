name: Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  frontend-test:
    name: Frontend - Unit Tests
    runs-on: ubuntu-latest

    # Only run if frontend files or shared dependencies changed
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.changed_files.*.filename, 'frontend/') ||
      contains(github.event.pull_request.changed_files.*.filename, 'pnpm-lock.yaml') ||
      contains(github.event.pull_request.changed_files.*.filename, '.github/workflows/test.yml')

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm run test

  backend-test:
    name: Backend - Unit Tests
    runs-on: ubuntu-latest

    # Only run if backend files or shared dependencies changed
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.changed_files.*.filename, 'backend/') ||
      contains(github.event.pull_request.changed_files.*.filename, 'pnpm-lock.yaml') ||
      contains(github.event.pull_request.changed_files.*.filename, '.github/workflows/test.yml')

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run prisma:generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

      - name: Run unit tests
        run: pnpm run test
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
