name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  frontend-ci:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest

    # Only run if frontend files or shared dependencies changed
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.changed_files.*.filename, 'frontend/') ||
      contains(github.event.pull_request.changed_files.*.filename, 'pnpm-lock.yaml') ||
      contains(github.event.pull_request.changed_files.*.filename, '.github/workflows/ci.yml')

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript type check
        run: pnpm exec tsc --noEmit

      - name: Build project
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_URL: 'http://localhost:3001'
          NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
          SITE_PASSWORD: 'ci-build-dummy'

  backend-ci:
    name: Backend - Lint & Build
    runs-on: ubuntu-latest

    # Only run if backend files or shared dependencies changed
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.changed_files.*.filename, 'backend/') ||
      contains(github.event.pull_request.changed_files.*.filename, 'pnpm-lock.yaml') ||
      contains(github.event.pull_request.changed_files.*.filename, '.github/workflows/ci.yml')

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run prisma:generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

      - name: Run Prettier check
        run: |
          pnpm exec prettier --check "src/**/*.{ts,js,json}" 2>&1 || {
            echo ""
            echo "========== Formatting diff =========="
            pnpm exec prettier --write "src/**/*.{ts,js,json}" > /dev/null 2>&1
            git diff --color
            exit 1
          }

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript type check
        run: pnpm exec tsc --noEmit

      - name: Build project
        run: pnpm run build
